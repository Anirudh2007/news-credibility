# Starts the API and the Streamlit frontend from one image (Phase 8).
#
#   docker compose up --build      API docs http://localhost:8000/docs, UI http://localhost:8501
#   docker compose run --rm api python -m pytest -q      test suite inside the image
#
# Trained models and reference data come from the host (git-ignored, not in the image):
# models/ must be filled first (README "Rebuild order"). No Redis: video analysis is future work.
# API keys (GOOGLE_FACTCHECK_API_KEY, TAVILY_API_KEY) come from .env here or in the folder above; never baked
# into the image. Lookup caches and the evidence memory live in the db volume, so they survive restarts.
services:
  api:
    build: .
    image: news-credibility:latest
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      NEWSCRED_WARMUP: "1"  # load every model at startup, not on the first request
      # LLM explanations: the router runs on the host, and "localhost" inside a container is
      # the container itself. Without a router the template explanation is used.
      EXPLAIN_BASE_URL: ${EXPLAIN_BASE_URL_DOCKER:-http://host.docker.internal:3001/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/app/models:ro
      - ./data/reference:/app/data/reference:ro
      - hf-cache:/cache/huggingface
      - db:/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s  # first start downloads ~1 GB of base models before /health answers

  frontend:
    build: .  # same image (cached build); only the command differs
    image: news-credibility:latest
    working_dir: /app/frontend  # Streamlit reads its theme from .streamlit/ in the working directory
    command: python -m streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      NEWSCRED_API: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf-cache:
  db:
